name: Build masterclass presentation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'chatgpt_presentation/generate_masterclass.py'
      - '.github/workflows/build-masterclass-presentation.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-build-masterclass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install --upgrade pip python-pptx

      - name: Generate PowerPoint
        run: python chatgpt_presentation/generate_masterclass.py

      - name: Prepare direct PowerPoint package
        run: |
          rm -rf chatgpt_presentation/pptx_package
          mkdir -p chatgpt_presentation/pptx_package
          python - <<'PY'
          import zipfile
          src = 'chatgpt_presentation/masterclass_russian_olympiad_10_slides.pptx'
          dst = 'chatgpt_presentation/pptx_package'
          with zipfile.ZipFile(src) as zf:
              zf.extractall(dst)
          PY

      - name: Upload direct PowerPoint package
        uses: actions/upload-artifact@v4
        with:
          name: masterclass-direct-pptx
          path: chatgpt_presentation/pptx_package/**
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Publish presentation to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_presentation/masterclass_russian_olympiad_10_slides.pptx
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update generated masterclass presentation [skip ci]"
            git push origin HEAD:chatgpt-build-masterclass
          fi
